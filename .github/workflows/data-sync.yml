name: Automated Core Data Synchronization

on:
  workflow_dispatch:

concurrency:
  group: killpv2-core-loop
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  data-matrix-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Fetch Repository Framework
        uses: actions/checkout@v4

      - name: Prepare Local Environments
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests[socks]

      - name: Optimize Network Engine Stack
        run: |
          sudo tee -a /etc/sysctl.conf << 'EOF'
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          net.core.rmem_max = 67108864
          net.core.wmem_max = 67108864
          net.ipv4.tcp_rmem = 4096 87380 67108864
          net.ipv4.tcp_wmem = 4096 65536 67108864
          net.core.netdev_max_backlog = 10000
          net.ipv4.tcp_max_syn_backlog = 10000
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_keepalive_time = 600
          EOF
          sudo sysctl -p

      - name: Fetch Academic Network Binaries
        run: |
          sudo apt-get update && sudo apt-get install -y unzip wget curl
          ZIP_DL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL1hUTFMvWHJheS1jb3JlL3JlbGVhc2VzL2xhdGVzdC9kb3dubG9hZC9YcmF5LWxpbnV4LTY0LnppcA==" | base64 -d)
          RUNTIME_DIR="/tmp/killpv2-runtime"
          rm -rf "$RUNTIME_DIR"
          mkdir -p "$RUNTIME_DIR"
          wget "$ZIP_DL" -O "$RUNTIME_DIR/xray.zip"
          sudo unzip -o "$RUNTIME_DIR/xray.zip" -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray
          sudo mkdir -p /usr/local/etc/xray
          sudo chmod -R 777 /usr/local/etc/xray

      - name: Establish Internal Proxy Gateway Routing
        run: |
          sudo apt-get update && sudo apt-get install -y nginx
          sudo rm -f /etc/nginx/sites-enabled/default

          cat << 'NGINX_EOF' | sudo tee /etc/nginx/sites-available/killpv2_gateway
          server {
              listen 8000 default_server;
              listen [::]:8000 default_server;

              location / {
                  proxy_pass http://127.0.0.1:8086;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
                  proxy_connect_timeout 10s;
              }

              location /killpv2 {
                  proxy_redirect off;
                  proxy_pass http://127.0.0.1:8085;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_buffering off;
                  proxy_read_timeout 52w;
              }
          }
          NGINX_EOF

          sudo ln -sf /etc/nginx/sites-available/killpv2_gateway /etc/nginx/sites-enabled/killpv2_gateway
          sudo nginx -t
          sudo systemctl restart nginx
          curl -fsS -I http://127.0.0.1:8000/ || true

      - name: Validate Cloudflare Domain And Token
        env:
          PANEL_DOMAIN: ${{ vars.PANEL_DOMAIN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          DOMAIN="${PANEL_DOMAIN:-www.vpnabol.kdns.fr}"
          DOMAIN=$(echo "$DOMAIN" | sed -E 's~^https?://~~' | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]' | sed 's/\.*$//')
          if [ -z "$DOMAIN" ] || ! echo "$DOMAIN" | grep -qE '^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$'; then
            echo "⚠️ دامنه نامعتبر بود؛ از www.vpnabol.kdns.fr استفاده می‌شود."
            DOMAIN="www.vpnabol.kdns.fr"
          fi
          echo "PANEL_DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          echo "🌐 Active Edge Domain: $DOMAIN"

          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "🚨 CLOUDFLARE_TUNNEL_TOKEN تنظیم نشده است."
            exit 1
          fi

      - name: Launch Operational Backend Microservice
        env:
          PANEL_DOMAIN: ${{ env.PANEL_DOMAIN }}
        run: |
          LOG_DIR="/tmp/killpv2-runtime/logs"
          mkdir -p "$LOG_DIR"
          rm -f "$LOG_DIR/analytics_worker.log"
          nohup python3 -u analytics_worker.py > "$LOG_DIR/analytics_worker.log" 2>&1 &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> "$GITHUB_ENV"
          echo "🚀 Backend PID: $BACKEND_PID"

          echo "⏳ Waiting for backend on 127.0.0.1:8086 ..."
          for i in {1..90}; do
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "❌ Backend exited before becoming ready."
              cat /tmp/killpv2-runtime/logs/analytics_worker.log || true
              exit 1
            fi

            if curl -fsS http://127.0.0.1:8086/ >/dev/null 2>&1; then
              echo "✅ Backend is ready on port 8086."
              break
            fi

            if [ "$i" -eq 90 ]; then
              echo "❌ Backend did not become ready within 180 seconds."
              cat /tmp/killpv2-runtime/logs/analytics_worker.log || true
              exit 1
            fi
            sleep 2
          done

          echo "--- backend startup log ---"
          tail -n 80 /tmp/killpv2-runtime/logs/analytics_worker.log || true

      - name: Establish Secure Edge Tunnel Core (Token-Based Named Tunnel)
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          TUNNEL_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2Nsb3VkZmxhcmUvY2xvdWRmbGFyZWQvcmVsZWFzZXMvbGF0ZXN0L2Rvd25sb2FkL2Nsb3VkZmxhcmVkLWxpbnV4LWFtZDY0LmRlYg==" | base64 -d)
          RUNTIME_DIR="/tmp/killpv2-runtime"
          mkdir -p "$RUNTIME_DIR"
          wget "$TUNNEL_URL" -O "$RUNTIME_DIR/edge_driver.deb"
          sudo dpkg -i "$RUNTIME_DIR/edge_driver.deb"

          sudo killall cloudflared || true
          LOG_DIR="/tmp/killpv2-runtime/logs"
          mkdir -p "$LOG_DIR"
          rm -f "$LOG_DIR/cloudflare_edge.log"
          nohup cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" > "$LOG_DIR/cloudflare_edge.log" 2>&1 &
          CLOUDFLARED_PID=$!
          echo "CLOUDFLARED_PID=$CLOUDFLARED_PID" >> "$GITHUB_ENV"

          echo "🚇 Cloudflared PID: $CLOUDFLARED_PID"
          echo "⏳ Waiting for cloudflared process and local gateway..."
          for i in {1..45}; do
            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "❌ cloudflared exited unexpectedly."
              cat /tmp/killpv2-runtime/logs/cloudflare_edge.log || true
              exit 1
            fi

            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "✅ Local gateway is healthy on port 8000."
            else
              echo "⚠️ Local gateway is not ready yet ($i/45)."
              sleep 2
              continue
            fi

            echo "--- cloudflared log ---"
            tail -n 80 /tmp/killpv2-runtime/logs/cloudflare_edge.log || true
            echo "✅ Cloudflared process is running; tunnel startup completed."
            break
          done

          if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
            echo "❌ cloudflared is no longer running."
            cat /tmp/killpv2-runtime/logs/cloudflare_edge.log || true
            exit 1
          fi

          echo "🌍 Testing the public Cloudflare endpoint: https://${PANEL_DOMAIN}"
          public_ok=0
          for i in {1..30}; do
            if curl -kfsS --connect-timeout 5 --max-time 15 "https://${PANEL_DOMAIN}/" >/dev/null 2>&1; then
              echo "✅ Public endpoint is reachable through Cloudflare."
              public_ok=1
              break
            fi
            echo "🔄 Public endpoint not ready yet ($i/30)."
            sleep 3
          done

          if [ "$public_ok" -ne 1 ]; then
            echo "❌ Public endpoint is not reachable. This usually means the Tunnel token's ingress/hostname points to the wrong service."
            echo "--- cloudflared log ---"
            tail -n 160 /tmp/killpv2-runtime/logs/cloudflare_edge.log || true
            echo "--- nginx status ---"
            sudo systemctl status nginx --no-pager || true
            echo "--- backend log ---"
            tail -n 160 /tmp/killpv2-runtime/logs/analytics_worker.log || true
            exit 1
          fi

      - name: Keep Service Alive And Monitor Health
        run: |
          # حدود 5 ساعت و 20 دقیقه؛ برای commit/push و اجرای چرخه بعدی زمان باقی می‌ماند.
          RUN_SECONDS=19200
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))

          echo "🟢 Service monitor started for ${RUN_SECONDS}s."
          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            sleep 15

            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "❌ Backend process died."
              tail -n 120 /tmp/killpv2-runtime/logs/analytics_worker.log || true
              exit 1
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "❌ Cloudflared process died."
              tail -n 120 /tmp/killpv2-runtime/logs/cloudflare_edge.log || true
              exit 1
            fi

            if ! curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "❌ Nginx gateway health-check failed."
              sudo nginx -t || true
              exit 1
            fi
          done

          echo "✅ Service lifetime reached normally."

      - name: Stop Background Services
        if: always()
        run: |
          kill "$CLOUDFLARED_PID" 2>/dev/null || true
          kill "$BACKEND_PID" 2>/dev/null || true
          sudo killall cloudflared 2>/dev/null || true
          sudo killall xray 2>/dev/null || true

      - name: Commit and Save State to Repository
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # فقط state واقعی را stage کن؛ runtime files خارج از repo هستند.
          git add -A -- panel_db.json sub_links || true
          if ! git diff --cached --quiet; then
            git commit -m "🔄 Save panel state before rotation [Skip CI]" || true
            git push origin HEAD:main || true
          else
            echo "ℹ️ No repository state changes to commit."
          fi

      - name: Trigger Successive Pipeline Execution Loop
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ GH_PAT is missing; the current cycle completed but the next cycle was not dispatched."
            exit 0
          fi
          gh workflow run data-sync.yml --ref main
          echo "⛓️ Next synchronization cycle dispatched."

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-diagnostics-${{ github.run_id }}
          path: |
            /tmp/killpv2-runtime/logs/analytics_worker.log
            /tmp/killpv2-runtime/logs/cloudflare_edge.log
          if-no-files-found: ignore
          retention-days: 3
